<!DOCTYPE html>
<html lang="ru"{% if page.url == '/en/crystalls.html' %} data-machine-translated="true"{% endif %}>
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
  <style>
   body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #f0f4f8, #ffffff);
      color: #333;
    }
    code {
      display: block;
      max-width: 900px;
      overflow-x: auto;
      white-space: pre;
      background: #f6f8fa;
      padding: 6px;
      border-radius: 4px;
      word-break: break-all;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .content {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    nav {
      background-color: #2a2a2a;
      padding: 10px 20px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }
  img, video {
    max-width: 75%;  
    height: auto;  
    display: block;    
    margin: 20px auto; 
  }

    nav a:hover {
      color: #76c7c0;
    }

    main {
      background: linear-gradient(to bottom right, #fefefe, #d0eaff);
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      margin-top: 20px;
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      color: #777;
    }

    footer a {
      color: #76c7c0;
      text-decoration: none;
    }

    footer a:hover {
      color: #58b7b2;
    }
      /* Machine translation notice - rendered via CSS content */
    html[data-machine-translated="true"] body::before {
      content: "Machine-translated from Russian. Some parts may be inaccurate.";
      display: block;
      margin-bottom: 12px;
      padding: 6px 10px;
      font-size: 0.85rem;
      color: #475569;
      background: #eef2f7;
      border: 1px solid #dde3ea;
      border-radius: 8px;
      text-align: center;
    }
</style>
</head>
<body>

  <div class="content">
    <nav>
      <a href="/index.html">Главная</a> |
      <a href="/contacts.html">Контакты</a>
    </nav>

    <main>
      <h1>{{ page.title }}</h1>
      <div>{{ content }}</div>
    </main>

    <footer>
    </footer>
  </div>

</body>
</html>
