<!DOCTYPE html>
<html lang="{{ page.lang | default: 'ru' }}"{% if page.translated %} data-translated="true"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="/assets/css/gallery.css"/>
  <style>
    :root { --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
    body { margin: 0 auto; max-width: 860px; padding: 20px 16px; line-height: 1.7; font-family: var(--sans); color: #1f2937; background: #f8fafc; }
    nav { margin-bottom: 12px; font-size: 0.95rem; }
    nav a { color: #2563eb; text-decoration: none; }
    h1 { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-weight: 600; line-height: 1.25; margin: 0 0 0.5rem; }
    img, video { max-width: 100%; height: auto; display: block; margin: 16px auto; border-radius: 6px; }
    pre, code { white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; font-family: var(--mono); font-size: 0.92em; }
    pre, code { background: #f1f5f9; padding: 6px 8px; border-radius: 4px; }
    pre { padding: 12px; }
    hr { border: 0; border-top: 1px solid #e2e8f0; margin: 1.25rem 0; }

    html[lang="en"]:not([data-translated="true"]) body::before { content: "Machine-translated from Russian. Some parts may be inaccurate."; display: block; margin-bottom: 12px; padding: 6px 10px; font-size: 0.85rem; color: #475569; background: #eef2f7; border: 1px solid #dde3ea; border-radius: 8px; text-align: center; }
  </style>
</head>
<body>
  <nav>
    {% if page.lang == 'en' %}
    <a href="/en/">Home</a> | <a href="/en/contacts.html">Contacts</a> | <a href="/index.html">RU</a>
    {% else %}
    <a href="/index.html">Главная</a> | <a href="/contacts.html">Контакты</a> | <a href="/en/">EN</a>
    {% endif %}
  </nav>
  <h1>{{ page.title }}</h1>
  <hr/>
  <div id="content">
    {{ content }}
  </div>
  <script src="/assets/js/gallery.js" defer></script>
</body>
</html>
